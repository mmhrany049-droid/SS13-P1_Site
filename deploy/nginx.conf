# SS 13 — nginx variant (one server block = one domain for /today and /workspace). Get the certificate with certbot.
server { listen 80; server_name ss.example.ir; return 301 https://$host$request_uri; }
server {
  listen 443 ssl http2; server_name ss.example.ir;
  ssl_certificate     /etc/letsencrypt/live/ss.example.ir/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/ss.example.ir/privkey.pem;
  client_max_body_size 2m;
  add_header Strict-Transport-Security "max-age=31536000" always;
  add_header X-Content-Type-Options nosniff always;
  location / { proxy_pass http://127.0.0.1:8080; proxy_http_version 1.1; proxy_set_header Host $host; proxy_set_header X-Forwarded-For $remote_addr; proxy_set_header X-Forwarded-Proto https; proxy_read_timeout 60s; }
}
